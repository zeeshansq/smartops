##############################################################################
#  SmartOps — Nginx Server Block
#  Domain:   smartops.nschool.pk
#  Backend:  Gunicorn ASGI → /run/gunicorn/smartops.sock
##############################################################################

# ─── Rate-Limiting Zones (defined in http {} context via nginx.conf) ─────────
# Add these lines inside the http {} block of /etc/nginx/nginx.conf
# (using smartops_ prefix to prevent collisions with existing sites on this server):
#
#   limit_req_zone $binary_remote_addr zone=smartops_api:10m rate=20r/m;
#   limit_req_zone $binary_remote_addr zone=smartops_general:10m rate=60r/m;

# ─── HTTP → HTTPS Redirect ────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name smartops.nschool.pk;

    # Certbot ACME challenge — required for Let's Encrypt renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS Application Server ─────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name smartops.nschool.pk;

    # ── TLS Certificates (managed by Certbot) ──────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/smartops.nschool.pk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smartops.nschool.pk/privkey.pem;

    # Mozilla Intermediate compatibility profile
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_stapling              on;
    ssl_stapling_verify       on;
    resolver                  1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout          5s;

    # ── Security Headers ───────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff"                                      always;
    add_header X-Frame-Options           "DENY"                                         always;
    add_header X-XSS-Protection          "1; mode=block"                                always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()"     always;

    # ── Tuning ────────────────────────────────────────────────────────────
    client_max_body_size 10M;    # Max upload size
    keepalive_timeout    65;

    # ── Static Files (served directly — no Gunicorn involvement) ──────────
    location /static/ {
        alias      /var/www/smartops/staticfiles/;
        expires    30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        gzip_static on;
    }

    # ── Media Files ───────────────────────────────────────────────────────
    location /media/ {
        alias      /var/www/smartops/media/;
        expires    7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── API Endpoints (stricter rate limiting) ────────────────────────────
    location /api/ {
        limit_req zone=smartops_api burst=10 nodelay;
        include /etc/nginx/snippets/proxy_params.conf;
        proxy_pass http://unix:/run/gunicorn/smartops.sock;
    }

    # ── Admin Panel (restrict to known IP if possible) ────────────────────
    location /admin/ {
        limit_req zone=smartops_general burst=5 nodelay;
        include /etc/nginx/snippets/proxy_params.conf;
        proxy_pass http://unix:/run/gunicorn/smartops.sock;
    }

    # ── Everything Else → Gunicorn ────────────────────────────────────────
    location / {
        limit_req zone=smartops_general burst=20 nodelay;
        include /etc/nginx/snippets/proxy_params.conf;
        proxy_pass http://unix:/run/gunicorn/smartops.sock;
    }
}
